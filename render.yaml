services:
  - type: web
    name: tambola-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: cd .. && npm install --include=dev && npm run build --workspace packages/shared && npm run build --workspace backend
    startCommand: node dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CALL_DEFAULT_MS
        value: 5000
      - key: RECONNECT_GRACE_MS
        value: 60000

  - type: web
    name: tambola-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: cd .. && npm install --include=dev && npm run build --workspace packages/shared && npm run build --workspace frontend
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
